# BeFreed fork only (BeFreed-ai/opentag). Never PR this file to first-tree-ai/opentag.
#
# Weekly: try to merge upstream/main into the fork's release branch on a throw-away branch, run the client tests,
# and open a PR INSIDE THE FORK (never upstream). A merge conflict or a red test fails the run (red run = look at it);
# nothing is pushed to the release branch itself and nothing is released.
name: BeFreed upstream sync

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC. Scheduled runs only fire from the fork's default branch.
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Fork branch to merge upstream/main into (default: vars.BEFREED_TARGET_BRANCH or befreed/release-pipeline)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: befreed-upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/first-tree-ai/opentag.git

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write # push the sync branch to the fork
      pull-requests: write # open the PR in the fork (repo setting "Allow GitHub Actions to create pull requests" must be on)
    env:
      TARGET: ${{ inputs.target_branch || vars.BEFREED_TARGET_BRANCH || 'befreed/release-pipeline' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET }}
          fetch-depth: 0

      - name: Fetch upstream main
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream main
          echo "upstream/main = $(git rev-parse --short upstream/main)"

      - name: Skip when already up to date or a sync PR is open
        id: gate
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "target already contains upstream/main"; exit 0
          fi
          open="$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$TARGET" --state open --search 'head:befreed/sync-upstream-' --json number --jq 'length')"
          if [ "$open" != "0" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "a sync PR is already open"; exit 0
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"

      - name: Merge upstream/main on a sync branch
        if: steps.gate.outputs.skip == '0'
        id: merge
        run: |
          git config user.name "befreed-upstream-sync"
          git config user.email "noreply@users.noreply.github.com"
          branch="befreed/sync-upstream-$(git rev-parse --short upstream/main)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git checkout -b "$branch"
          if ! git merge --no-edit upstream/main; then
            echo "::error::merge conflict between upstream/main and $TARGET:"; git diff --name-only --diff-filter=U
            git merge --abort; exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.gate.outputs.skip == '0'
        with:
          version: 10.12.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.skip == '0'
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        if: steps.gate.outputs.skip == '0'
        run: pnpm install --frozen-lockfile --config.engine-strict=true

      - name: Client tests and type-check on the merged tree
        if: steps.gate.outputs.skip == '0'
        run: |
          pnpm --filter @opentag/client test
          pnpm --filter @opentag/client typecheck
          node --test --test-concurrency=1 scripts/__tests__/befreed-release.test.mjs scripts/__tests__/portable-build.test.mjs

      - name: Push the sync branch and open a PR in the fork
        if: steps.gate.outputs.skip == '0'
        env:
          BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          git push origin "$BRANCH"
          # --repo is essential: in a fork, gh would otherwise default to the upstream parent repository.
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$TARGET" --head "$BRANCH" \
            --title "Sync upstream/main ($(git rev-parse --short upstream/main)) into $TARGET" \
            --body "Automatic merge of first-tree-ai/opentag main into $TARGET. Client tests and type-check passed on the merged tree. Review, merge, then run the BeFreed client release workflow with a new build number."
