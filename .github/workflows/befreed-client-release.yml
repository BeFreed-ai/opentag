# BeFreed fork only (BeFreed-ai/opentag). Not part of upstream; never PR this file to first-tree-ai/opentag.
#
# Builds the openTag CLIENT as a portable per-platform tarball from THIS fork's source, the same way upstream's
# portable release does (scripts/prepare-cli-release.mjs -> apps/cli build -> scripts/portable/build-release.sh ->
# scripts/portable/verify-portable-artifact.mjs), then attaches tarball + sha256 to a GitHub Release of the fork.
# Differences from upstream's release (on purpose): no npm publish, no Google Cloud Storage upload, no Runner image,
# no OIDC/secrets - only the default GITHUB_TOKEN. The version label is <upstream-version>-befreed.<n>.
name: BeFreed client release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "n in <upstream-version>-befreed.<n> (positive integer, never reuse one)"
        required: true
        type: string
      ref:
        description: "Branch/tag/SHA of the fork to build (default: the branch the workflow runs on)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: befreed-client-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # create the fork's GitHub Release; uses the default GITHUB_TOKEN only
    steps:
      - name: Check build number
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "build_number must be a positive integer"; exit 1; }

      - name: Check out the fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Compute label
        id: label
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          base="$(node -p "require('./apps/cli/package.json').version")"
          label="${base}-befreed.${BUILD_NUMBER}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "tag=befreed-v${label}" >> "$GITHUB_OUTPUT"
          echo "Building $label from $(git rev-parse HEAD)"

      - name: Refuse to reuse a label
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.label.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; pick a new build_number"; exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=true

      # Tests first, for the area the fork changes (scheduled session-message turns) plus the fork's own
      # packaging scripts. The whole upstream suite runs in upstream's CI; the nightly sync workflow runs the
      # client suite after every merge from upstream.
      - name: Client tests for the changed area
        run: pnpm --filter @opentag/client exec vitest run --maxWorkers=1 src/__tests__/session-message-inbox.test.ts src/__tests__/agent-turn-runner.test.ts

      - name: Client type-check
        run: pnpm --filter @opentag/client typecheck

      - name: Packaging script tests
        run: node --test --test-concurrency=1 scripts/__tests__/befreed-release.test.mjs scripts/__tests__/portable-build.test.mjs

      # Same order as upstream's production job: build workspaces, rewrite identity, rebuild the CLI.
      - name: Build source workspaces
        run: pnpm build

      - name: Prepare prod package identity (upstream script, upstream version)
        run: node scripts/prepare-cli-release.mjs --channel prod --version "${{ steps.label.outputs.base }}"

      - name: Apply fork version label
        run: node scripts/befreed/set-fork-version.mjs "${{ steps.label.outputs.label }}"

      - name: Build CLI
        run: pnpm --dir apps/cli build

      - name: Build portable tarballs (linux-x64, linux-arm64)
        run: >-
          ./scripts/portable/build-release.sh
          --channel prod
          --version "${{ steps.label.outputs.label }}"
          --skip-workspace-build
          --platform linux-x64
          --platform linux-arm64

      - name: Verify tarballs (upstream verifier; executes the host-platform one)
        env:
          LABEL: ${{ steps.label.outputs.label }}
        run: |
          dir=".portable-release/prod/$LABEL"
          for platform in linux-x64 linux-arm64; do
            node scripts/portable/verify-portable-artifact.mjs \
              --manifest "$dir/manifest.json" \
              --platform "$platform" \
              --tarball "$dir/open-tag-$LABEL-$platform.tar.gz"
          done

      # Same marker the operator's `client_release.py check` looks for: inside SessionMessageInbox.#runMessage the
      # bundle declares `let launchConfiguration = {}` and spreads `...launchConfiguration` into runtime.prompt.
      # The tarball is flat (VERSION, INSTALL.json, app/, node/, bin/ at its root).
      - name: Check the fix is in the bundle and the CLI reports the label
        env:
          LABEL: ${{ steps.label.outputs.label }}
        run: |
          x="$RUNNER_TEMP/x"; mkdir -p "$x"
          tar -xzf ".portable-release/prod/$LABEL/open-tag-$LABEL-linux-x64.tar.gz" -C "$x"
          python3 - "$x" <<'PY'
          import glob, sys
          f = glob.glob(sys.argv[1] + "/app/program-*.mjs")[0]
          s = open(f, encoding="utf-8").read()
          w = s[s.index("async #runMessage("):][:8000]
          assert "let launchConfiguration = {}" in w and "...launchConfiguration" in w, "fix marker missing in #runMessage"
          print("fix marker present in", f)
          PY
          test "$(cat "$x/VERSION")" = "$LABEL"
          "$x/node/bin/node" "$x/app/cli/index.mjs" --version | grep -Fx "$LABEL"

      - name: Write sha256 files
        env:
          LABEL: ${{ steps.label.outputs.label }}
        run: |
          cd ".portable-release/prod/$LABEL"
          for f in open-tag-*.tar.gz; do sha256sum "$f" > "$f.sha256"; done
          cat ./*.sha256

      - name: Create the fork's GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ steps.label.outputs.label }}
          TAG: ${{ steps.label.outputs.tag }}
        run: |
          SRC_SHA="$(git rev-parse HEAD)"
          cd ".portable-release/prod/$LABEL"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SRC_SHA" \
            --title "openTag client $LABEL" \
            --notes "BeFreed fork build of the openTag client, label $LABEL. Source: $SRC_SHA. Not an upstream release." \
            --prerelease \
            open-tag-*.tar.gz open-tag-*.tar.gz.sha256 manifest.json SHA256SUMS
