# BeFreed fork only (BeFreed-ai/opentag). Not part of upstream; never PR this file to first-tree-ai/opentag.
#
# Builds the openTag SERVER image from THIS fork's source with the upstream Dockerfile (target `runtime`: the ordinary
# image, no private cloud-billing package) and publishes it to GHCR under the fork's own namespace, using only the
# default GITHUB_TOKEN (no new secrets, no AWS). Upstream's docker.yml is hard-wired to the upstream repository
# (`github.repository == 'first-tree-ai/opentag'`), so it never runs here; this is the fork's own pipeline.
#
# Tag format: <upstream-version>-befreed.<n>, for example 0.1.5-befreed.1. A tag is never reused: the run refuses
# when the image tag or the git tag `befreed-server-v<version>` already exists. The git tag is created last and
# records the exact source SHA of the image.
#
# Manual only (workflow_dispatch). Nothing deploys from here; see BEFREED.md for the deploy and rollback steps.
name: BeFreed server image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "<upstream-version>-befreed.<n>, e.g. 0.1.5-befreed.1 (the base must equal apps/cli version; n never reused)"
        required: true
        type: string
      ref:
        description: "Branch/tag/SHA of the fork to build (default: the branch the workflow runs on)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: befreed-server-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # push the git tag that records the source SHA (default GITHUB_TOKEN)
      packages: write # push to ghcr.io/befreed-ai/opentag (default GITHUB_TOKEN)
    steps:
      - name: Check the version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-befreed\.[1-9][0-9]*$ ]] || {
            echo "version must look like 0.1.5-befreed.1"; exit 1; }

      - name: Check out the fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Compute names and refuse to reuse a version
        id: names
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(node -p "require('./apps/cli/package.json').version")"
          [ "${VERSION%%-befreed.*}" = "$base" ] || {
            echo "version base ${VERSION%%-befreed.*} does not match the source's upstream version $base"; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="befreed-server-v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "git tag ${tag} already exists; pick a new n"; exit 1
          fi
          {
            echo "image=$image"
            echo "tag=$tag"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${image}:${VERSION} from $(git rev-parse HEAD)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to reuse an image tag
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          VERSION: ${{ inputs.version }}
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "${IMAGE}:${VERSION} already exists; pick a new n"; exit 1
          fi

      # Same Node as the Dockerfile (24). The focused tests cover the one thing this fork changes in the server;
      # the whole upstream suite runs in the fork's ci.yml on pull requests.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=true

      - name: Build the server's workspace dependencies and type-check
        run: pnpm exec turbo run typecheck --filter=@opentag/server

      - name: Server tests for the fork's change
        run: >-
          pnpm --filter @opentag/server exec vitest run --maxWorkers=1
          src/__tests__/operator-schedule-api.test.ts
          src/__tests__/operator-routes-config.test.ts
          src/__tests__/agent-schedule-api.test.ts

      - name: Build and publish the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64 # the OpenTag host is x86_64 (t3.medium); add linux/arm64 only when a host needs it
          push: true
          build-args: |
            OPENTAG_BUILD_REVISION=${{ steps.names.outputs.sha }}
            OPENTAG_WEB_VERSION=${{ inputs.version }}
          tags: ${{ steps.names.outputs.image }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.names.outputs.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=BeFreed fork of the openTag server (not an upstream release)
          # A plain single-platform manifest keeps `docker compose pull` and the rollback tag trivial.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=befreed-server-image
          cache-to: type=gha,mode=max,scope=befreed-server-image

      - name: Record the source SHA as a git tag
        env:
          TAG: ${{ steps.names.outputs.tag }}
          SHA: ${{ steps.names.outputs.sha }}
        run: |
          git tag "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"

      - name: Summarise
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ steps.names.outputs.sha }}
        run: |
          {
            echo "### BeFreed server image"
            echo
            printf -- "- Tag: \`%s:%s\`\n" "$IMAGE" "$VERSION"
            printf -- "- Digest (the only byte-for-byte pin): \`%s@%s\`\n" "$IMAGE" "$DIGEST"
            printf -- "- Source: \`%s\`\n" "$SHA"
            echo "- Not deployed. See BEFREED.md for the deploy and rollback steps."
          } >> "$GITHUB_STEP_SUMMARY"
